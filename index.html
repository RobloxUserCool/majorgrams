<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MajorGram</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; background:#0f1419;
         color:#fff; font-family:system-ui,sans-serif; padding:20px;
         box-sizing:border-box; }
  h1 { font-size:42px; margin:0 0 24px; }
  input, button { width:100%; max-width:320px; padding:14px; margin:6px 0;
         border-radius:10px; border:1px solid #2f3b47; font-size:16px;
         box-sizing:border-box; }
  input { background:#1a222b; color:#fff; }
  button { background:#2b7fff; color:#fff; border:none; font-weight:600; }
  button.second { background:#1a222b; border:1px solid #2f3b47; }
  #msg { margin-top:14px; min-height:24px; color:#8b98a5; }
</style>
</head>
<body>
  <h1>MajorGram</h1>
  <div id="auth">
    <input id="u" placeholder="Ник" autocomplete="username">
    <input id="p" type="password" placeholder="Пароль">
    <button id="login">Войти</button>
    <button id="reg" class="second">Регистрация</button>
  </div>
  <div id="app" style="display:none">
    <p id="hello"></p>
    <button id="logout" class="second">Выйти</button>
  </div>
  <div id="msg"></div>
  <script src="/app.js"></script>
</body>
</html>
