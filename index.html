<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MajorGram</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="auth">
    <h1>MajorGram</h1>
    <input id="u" placeholder="Ник" autocomplete="username">
    <input id="p" type="password" placeholder="Пароль">
    <button id="login">Войти</button>
    <button id="reg" class="second">Регистрация</button>
    <div id="msg"></div>
  </div>

  <div id="app">
    <div id="top">
      <button id="back" style="display:none">←</button>
      <div id="title">Чаты</div>
    </div>

    <div id="pages">
      <div class="page on" id="pg-chats">
        <div class="row" id="open-general">
          <div class="ava">#</div>
          <div>
            <div class="name">Общий чат</div>
            <div class="sub">Все пользователи MajorGram</div>
          </div>
        </div>
      </div>

      <div class="page" id="pg-chat">
        <div id="list"></div>
        <div id="bar">
          <input id="t" placeholder="Сообщение">
          <button id="send">➤</button>
        </div>
      </div>

      <div class="page" id="pg-contacts">
        <div class="pad">
          <h2>Контакты</h2>
          <div class="muted">Скоро здесь появятся люди</div>
        </div>
      </div>

      <div class="page" id="pg-settings">
        <div class="pad">
          <h2>Настройки</h2>
          <div class="muted">Пока настроек нет</div>
          <button id="logout" class="second" style="margin-top:20px">Выйти</button>
        </div>
      </div>

      <div class="page" id="pg-profile">
        <div class="pad" style="text-align:center">
          <div class="ava" id="bigava" style="width:90px;height:90px;font-size:38px;margin:10px auto"></div>
          <h2 id="pname"></h2>
          <div class="muted">Профиль MajorGram</div>
        </div>
      </div>
    </div>

    <div id="nav">
      <button data-p="chats" class="on"><b>💬</b>Чаты</button>
      <button data-p="contacts"><b>👥</b>Контакты</button>
      <button data-p="settings"><b>⚙️</b>Настройки</button>
      <button data-p="profile"><b>👤</b>Профиль</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
<!-- конец -->
